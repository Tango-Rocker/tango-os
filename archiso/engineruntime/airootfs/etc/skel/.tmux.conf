set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

set -g status-style bg=black,fg=white
set -g status-left-length 40
set -g status-left "#[bold]#S #[default]"
set -g status-right "%Y-%m-%d %H:%M"

set -g @engineos-plugins 'tmux-sensible tmux-yank tmux-resurrect tmux-continuum tmux-pain-control'
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

run-shell -b 'for plugin_script in /usr/share/tmux/plugins/tmux-sensible/sensible.tmux /usr/share/tmux/plugins/tmux-yank/yank.tmux /usr/share/tmux/plugins/tmux-resurrect/resurrect.tmux /usr/share/tmux/plugins/tmux-continuum/continuum.tmux /usr/share/tmux/plugins/tmux-pain-control/pain_control.tmux; do test -r "$plugin_script" && sh "$plugin_script"; done'
