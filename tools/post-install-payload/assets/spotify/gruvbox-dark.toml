[[themes]]
name = "engineos-gruvbox-dark"

[themes.palette]
background = "#282828"
foreground = "#ebdbb2"
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright_black = "#928374"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "#ebdbb2"

[themes.component_style]
block_title = { fg = "bright_yellow", modifiers = ["Bold"] }
border = { fg = "bright_black" }
playback_track = { fg = "bright_green", modifiers = ["Bold"] }
playback_artists = { fg = "bright_cyan" }
playback_album = { fg = "bright_yellow" }
playback_metadata = { fg = "bright_black" }
playback_progress_bar = { bg = "bright_black", fg = "bright_green" }
current_playing = { fg = "bright_green", modifiers = ["Bold"] }
page_desc = { fg = "bright_cyan", modifiers = ["Bold"] }
table_header = { fg = "bright_blue", modifiers = ["Bold"] }
selection = { bg = "blue", fg = "bright_white", modifiers = ["Bold"] }
