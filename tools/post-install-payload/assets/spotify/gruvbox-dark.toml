[[themes]]
name = "engineos-gruvbox-dark"

[themes.palette]
background = "#282828"
foreground = "#ebdbb2"
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"
bright_black = "#928374"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "#ebdbb2"

[themes.component_style]
block_title = { fg = "#fabd2f", modifiers = ["Bold"] }
border = { fg = "#928374" }
playback_track = { fg = "#b8bb26", modifiers = ["Bold"] }
playback_artists = { fg = "#8ec07c" }
playback_album = { fg = "#fabd2f" }
playback_metadata = { fg = "#928374" }
playback_progress_bar = { bg = "#928374", fg = "#b8bb26" }
current_playing = { fg = "#b8bb26", modifiers = ["Bold"] }
page_desc = { fg = "#8ec07c", modifiers = ["Bold"] }
table_header = { fg = "#83a598", modifiers = ["Bold"] }
selection = { bg = "#458588", fg = "#ebdbb2", modifiers = ["Bold"] }
