set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g status-interval 5

set -g status-style bg=colour235,fg=colour250
set -g status-left-length 70
set -g status-right-length 140
set -g status-left "#[fg=colour16,bg=colour39,bold] #S #[fg=colour39,bg=colour236] #[fg=colour250,bg=colour236]#H #[fg=colour236,bg=colour235] "
set -g status-right "#[fg=colour245]#{pane_current_command} #[fg=colour39]#I:#P #[fg=colour250]#{pane_current_path} #[fg=colour214]%Y-%m-%d #[fg=colour82]%H:%M "
setw -g window-status-format "#[fg=colour244] #I:#W "
setw -g window-status-current-format "#[fg=colour16,bg=colour82,bold] #I:#W "
setw -g pane-border-style fg=colour238
setw -g pane-active-border-style fg=colour39

set -g @engineos-plugins 'tmux-sensible tmux-yank tmux-resurrect tmux-continuum tmux-pain-control'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes ':all:'

bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind S run-shell -b 'engineos-tmux-pane-bridge sync' \; display-message "EngineOS panes synced"
bind G run-shell -b 'engineos-tmux-pane-bridge geometry --all-visible' \; display-message "EngineOS GUI pane geometry synced"

set-hook -g client-attached 'run-shell -b "engineos-tmux-pane-bridge sync"'
set-hook -g after-select-window 'run-shell -b "TMUX_PANE=#{pane_id} engineos-tmux-pane-bridge focus --pane #{pane_id} --client-tty #{client_tty}"'
set-hook -g after-select-pane 'run-shell -b "TMUX_PANE=#{pane_id} engineos-tmux-pane-bridge focus --pane #{pane_id} --client-tty #{client_tty}"'
set-hook -g after-resize-pane 'run-shell -b "engineos-tmux-pane-bridge geometry --all-visible"'
set-hook -g after-select-layout 'run-shell -b "engineos-tmux-pane-bridge geometry --all-visible"'
set-hook -g window-layout-changed 'run-shell -b "engineos-tmux-pane-bridge geometry --all-visible"'
set-hook -g client-resized 'run-shell -b "engineos-tmux-pane-bridge geometry --all-visible"'

run-shell -b 'for plugin_script in /usr/share/tmux/plugins/tmux-sensible/sensible.tmux /usr/share/tmux/plugins/tmux-yank/yank.tmux /usr/share/tmux/plugins/tmux-resurrect/resurrect.tmux /usr/share/tmux/plugins/tmux-continuum/continuum.tmux /usr/share/tmux/plugins/tmux-pain-control/pain_control.tmux; do test -r "$plugin_script" && sh "$plugin_script"; done'
