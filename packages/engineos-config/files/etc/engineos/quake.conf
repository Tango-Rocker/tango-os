# EngineOS Quake asset configuration.
#
# EngineOS does not ship commercial Quake data. To use your own files, copy
# pak0.pak into one of the documented asset directories or set:
#
# ENGINEOS_QUAKE_ID1=/path/to/id1
ENGINEOS_QUAKE_ID1_DEFAULT=/var/lib/engineos/assets/quake/id1

# SDL2 talks to the PipeWire graph through pipewire-pulse in the live ISO.
# Override in ~/.config/engineos/quake.conf if a target machine needs alsa.
ENGINEOS_QUAKE_SDL_AUDIODRIVER=pulseaudio

# Extra QuakeSpasm launch arguments. Keep this empty by default so normal
# interactive launches use the user's resolution and sound settings.
ENGINEOS_QUAKE_ARGS=
