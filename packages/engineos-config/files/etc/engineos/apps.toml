# EngineOS pane-presentation app registry.
#
# This file declares the MVP graphical app contract used by the native mux app
# launcher and proof tooling. Keep commands canonical here; source-tree helpers may
# rewrite a leading `eos-*` to the local checkout command path.

[apps.cube]
slot = "pane"
role = "presentation"
command = "eos-app launch cube"
smoke_command = "eos-app launch cube --smoke"
package = "engineos-cube"
app_ids = ["engineos-cube"]
log = "cube.log"
health = "gl-renderer-and-frames"
input = "normal"
capture = "none"
instance = "dedicated"

[apps.quake]
slot = "pane"
role = "presentation"
command = "eos-app launch quake"
smoke_command = "eos-app launch quake --smoke"
package = "engineos-quakespasm"
app_ids = ["quakespasm", "quake", "engine"]
log = "engine.log"
assets = "quake"
health = "engine-mapped-or-asset-guidance"
input = "game"
capture = "optional"
instance = "dedicated"

[apps.wargus]
slot = "pane"
role = "presentation"
command = "eos-app launch wargus"
smoke_command = "eos-app launch wargus --smoke"
package = "engineos-wargus"
app_ids = ["stratagus"]
log = "launcher.log"
health = "pane-presentation"
input = "game"
capture = "optional"
instance = "dedicated"

[apps.falkon]
slot = "pane"
role = "presentation"
command = "eos-app launch falkon"
commands = ["falkon"]
launch_mode = "pane-wayland"
argv = ["/usr/bin/falkon"]
package = "falkon"
app_ids = ["org.kde.falkon", "falkon"]
log = "app.log"
health = "pane-presentation"
input = "normal"
capture = "none"
instance = "dedicated"

[apps.chatgpt]
slot = "pane"
role = "presentation"
command = "eos-app launch chatgpt"
commands = ["chatgpt"]
launch_mode = "pane-wayland"
argv = ["/usr/bin/engineos-chatgpt"]
package = "engineos-chatgpt"
app_ids = ["com.engineos.ChatGPT", "engineos-chatgpt"]
log = "app.log"
health = "webauthn-and-pane-presentation"
input = "normal"
capture = "none"
instance = "dedicated"

[apps.chroma]
slot = "pane"
role = "presentation"
command = "eos-app launch chroma"
commands = ["chroma"]
launch_mode = "pane-wayland"
argv = ["/usr/bin/chroma-launcher-client"]
user_service = "chroma-worker.service"
package = "stable-diffusion.cpp-pipefusion"
app_ids = ["stable-diffusion-chroma"]
log = "chroma.log"
health = "pane-presentation"
input = "normal"
capture = "none"
instance = "dedicated"
