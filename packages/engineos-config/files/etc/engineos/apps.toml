# EngineOS launchpad app registry.
#
# This file declares the MVP app contract used by the shell runner, app launcher,
# and proof tooling. Keep commands canonical here; source-tree helpers may
# rewrite a leading `eos-*` to the local checkout command path.

[apps.terminal]
slot = "terminal"
role = "terminal"
command = "eos-app launch terminal"
package = "foot"
app_ids = ["foot", "terminal", "alacritty", "kitty", "wezterm"]
log = "terminal.log"
health = "terminal-owner-log"
input = "normal"
capture = "none"

[apps.terminal-secondary]
slot = "terminal-secondary"
role = "terminal-secondary"
command = "eos-app launch terminal-secondary"
package = "foot"
app_ids = ["engineos-terminal-secondary", "terminal-secondary"]
log = "terminal.log"
health = "terminal-owner-log"
input = "normal"
capture = "none"

[apps.cube]
slot = "cube"
role = "cube"
command = "eos-app launch cube"
smoke_command = "eos-app launch cube --smoke"
package = "engineos-cube"
app_ids = ["engineos-cube"]
log = "cube.log"
health = "gl-renderer-and-frames"
input = "normal"
capture = "none"

[apps.quake]
slot = "engine"
role = "engine"
command = "eos-app launch quake"
smoke_command = "eos-app launch quake --smoke"
package = "engineos-quakespasm"
app_ids = ["quakespasm", "quake", "engine"]
log = "engine.log"
assets = "quake"
health = "engine-mapped-or-asset-guidance"
input = "game"
capture = "optional"
