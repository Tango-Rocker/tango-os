schema = "engineos-agent-supervisor-v1"
project = "Tang-OS"
state_dir = ".agent-insights/out/supervisor"
report_name = ".agent-insights/out/supervisor/latest-report.md"
since_days = 30
quiet_seconds = 300
trigger_every = 5
chunk_lines = 160
max_chunks = 1
model = "gpt-5.4-mini"
reasoning_effort = "low"

[budget]
recent_sessions = 5
max_total_tokens_per_session = 50000000
max_uncached_input_tokens_per_session = 1500000
max_output_tokens_per_session = 125000
max_compactions_per_session = 3
